name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Built from a clean checkout with the full test suite. A release jar that
      # skipped the tests is a release jar nobody should trust.
      - name: Build
        run: mvn -B --no-transfer-progress clean verify

      - name: Check the tag matches the project version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match pom version $version"
            exit 1
          fi
          echo "Releasing $tag from version $version"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: target/GodView-*.jar
          generate_release_notes: true
          body: |
            Requires **Paper 1.21 – 1.21.11** and **Java 21+**.

            Drop the jar in `plugins/`, restart, then create the first account —
            there is no default login:

            ```
            /godview user add admin admin
            ```

            The password is printed once, in the console. Then open
            `http://your-server:8899`.

            Before exposing the panel on a public host, read
            [Securing the panel](https://github.com/sysfox/GodView/blob/master/docs/installation.md#securing-the-panel).
